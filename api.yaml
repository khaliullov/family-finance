openapi: 3.1.0
info:
  title: Family Finance API
  version: 1.0.0
  description: >
    Implementation-ready REST API specification for Family Finance, a self-hosted family accounting system.
    All monetary amounts are represented as 64-bit integers in minor currency units (e.g. kopeks/cents).
    Implements the Two-Layer Ledger: BankTransaction (evidence) and AccountingEntry (interpretation) with stable TransactionView identity.
servers:
  - url: /api/v1
    description: Primary API server

paths:
  # ==========================================
  # Authentication & Family Context
  # ==========================================
  /auth/register:
    post:
      summary: Register initial user and create family space (Bootstrap)
      operationId: register
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      summary: Authenticate user via email and password
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      summary: Retrieve current authenticated user and family profile
      operationId: getMe
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile and active family memberships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a fresh access token
      operationId: refreshToken
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      summary: Terminate refresh session chain and logout
      operationId: logout
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out successfully
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/sessions:
    get:
      summary: List active user authentication sessions
      operationId: listSessions
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionDTO'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/sessions/{id}:
    delete:
      summary: Revoke a specific authentication session
      operationId: revokeSession
      tags: [Auth]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Session revoked successfully
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /families/members:
    get:
      summary: List all members of the current family space
      operationId: listFamilyMembers
      tags: [Family]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of family members in the active family space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMember'

    post:
      summary: Invite a partner to the family space
      operationId: inviteFamilyMember
      tags: [Family]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: Member invited or added to the family space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMember'

  # ==========================================
  # Bank Connections & Sidecar Pairing
  # ==========================================
  /connections/providers:
    get:
      summary: List supported bank connection providers
      operationId: listProviders
      tags: [Connections]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of supported banking providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderInfo'

  /connections:
    get:
      summary: List all bank and import connections in the family
      operationId: listConnections
      tags: [Connections]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of configured bank connections for the family
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankConnection'

    post:
      summary: Create a new bank connection
      operationId: createConnection
      tags: [Connections]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Bank connection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankConnection'

  /connections/{connection_id}:
    get:
      summary: Get details for a specific bank connection
      operationId: getConnection
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bank connection details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankConnection'
        '404':
          $ref: '#/components/responses/ProblemDetails'

    delete:
      summary: Disconnect a bank connection and clear credentials
      operationId: disconnectConnection
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connection disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: disconnected
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/auth/start:
    post:
      summary: Start authentication workflow for a bank connection
      operationId: authStart
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authentication attempt initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                  provider:
                    type: string
                  status:
                    type: string
                    example: authenticating
                  instructions:
                    type: string
                  next_step:
                    type: string
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/auth/status:
    get:
      summary: Query authentication status of a bank connection
      operationId: authStatus
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authentication status summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                  provider:
                    type: string
                  status:
                    type: string
                  is_authenticated:
                    type: boolean
                  last_authenticated_at:
                    type: string
                    format: date-time
                  error_message:
                    type: string
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/auth/session:
    post:
      summary: Submit verified session cookies or payload to activate bank connection
      operationId: authSession
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionRequest'
      responses:
        '200':
          description: Banking session verified and activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: connected
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/auth/cancel:
    post:
      summary: Cancel ongoing authentication attempt and return to created status
      operationId: authCancel
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authentication cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: created
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/validate:
    post:
      summary: Trigger safe read-only validation of bank connection instruments and transactions
      operationId: triggerValidation
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sync
          in: query
          required: false
          schema:
            type: boolean
          description: Execute validation synchronously and return full report
      responses:
        '200':
          description: Validation finished (synchronous execution)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '202':
          description: Validation job enqueued (asynchronous execution)
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: validation_pending
                  connection_id:
                    type: string
                    format: uuid
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/validation/status:
    get:
      summary: Get current validation state and last report reference
      operationId: validationStatus
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current validation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  last_validated_at:
                    type: string
                    format: date-time
                  last_validation_status:
                    type: string
                  last_validation_report_id:
                    type: string
                    format: uuid
                  error_message:
                    type: string
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/validation/reports:
    get:
      summary: List historical validation reports for connection
      operationId: listValidationReports
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of validation report summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationReportSummary'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/validation/reports/{report_id}:
    get:
      summary: Retrieve full validation report JSON
      operationId: getValidationReport
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: report_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Complete validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/reconnect:
    post:
      summary: Reconnect an expired or failed bank connection
      operationId: reconnectConnection
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reconnection started
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection_id:
                    type: string
                    format: uuid
                  provider:
                    type: string
                  status:
                    type: string
                    example: authenticating
                  instructions:
                    type: string
                  next_step:
                    type: string
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'

  /connections/pair:
    post:
      summary: Exchange single-use pairing secret for sidecar connection API key
      operationId: pairConnection
      tags: [Connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairConnectionRequest'
      responses:
        '200':
          description: Sidecar paired successfully and API key issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairConnectionResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /connections/{connection_id}/sync:
    post:
      summary: Trigger an on-demand synchronization job for a bank connection
      operationId: triggerSync
      tags: [Connections]
      security:
        - BearerAuth: []
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lookback_days:
                  type: integer
                  default: 30
      responses:
        '202':
          description: Sync job enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncJobResponse'

  # ==========================================
  # Accounts & Cards
  # ==========================================
  /accounts:
    get:
      summary: List all accounts across the family
      operationId: listAccounts
      tags: [Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: owner_user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of financial accounts and linked cards for the family
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountWithCards'

    post:
      summary: Create a manual cash account
      operationId: createManualAccount
      tags: [Accounts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /accounts/{account_id}:
    get:
      summary: Get account details by ID
      operationId: getAccount
      tags: [Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account details with balance breakdown and linked cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountWithCards'

  # ==========================================
  # Transactions & Two-Layer Ledger Views
  # ==========================================
  /transactions:
    get:
      summary: Query transactions with rich filtering and pagination (returns aggregated TransactionView)
      operationId: listTransactions
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: account_ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: category_ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: payer_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: beneficiary_type
          in: query
          schema:
            type: string
            enum: [household, partner_a, partner_b, child, other]
        - name: classification
          in: query
          schema:
            type: string
            enum: [expense, income, transfer, debt_repayment, excluded]
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, posted, cancelled]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Paginated list of unified transactions and accounting entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionViews'

    post:
      summary: Create a manual cash accounting entry (bank_transaction_id is null)
      operationId: createManualTransaction
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManualTxRequest'
      responses:
        '201':
          description: Manual cash transaction and accounting entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionView'

  /transactions/{id}:
    get:
      summary: Get full aggregated TransactionView for a bank transaction, entry, or view ID
      description: Resolves view_id ('bt:...' or 'manual:...'), bank_transaction_id, or entry_id to the complete TransactionView with all split sibling entries.
      operationId: getTransactionView
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transaction details including bank evidence and split entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionView'

  /transactions/entries/{entry_id}:
    patch:
      summary: Update accounting interpretation (category, attribution, comment) on an accounting entry
      description: Bank evidence fields cannot be mutated through this endpoint.
      operationId: patchAccountingEntry
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAccountingEntryRequest'
      responses:
        '200':
          description: Accounting entry updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionView'

  /transactions/entries/{entry_id}/split:
    post:
      summary: Split an accounting entry into multiple categorized entries
      operationId: splitAccountingEntry
      tags: [Transactions]
      security:
        - BearerAuth: []
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitTransactionRequest'
      responses:
        '200':
          description: Accounting entry atomically replaced by split entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionView'

  # ==========================================
  # Categories & Deterministic Rules
  # ==========================================
  /categories:
    get:
      summary: Retrieve the hierarchical category tree
      operationId: getCategoryTree
      tags: [Categories]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of household spending and income categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTreeNode'

    post:
      summary: Create a new custom category or subcategory
      operationId: createCategory
      tags: [Categories]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /rules:
    get:
      summary: List all categorization rules ordered by priority
      operationId: listRules
      tags: [Rules]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of automated categorization rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorizationRule'

    post:
      summary: Create a categorization rule (and optionally apply retroactively)
      operationId: createRule
      tags: [Rules]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: Categorization rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorizationRule'

  # ==========================================
  # Transfer Matcher (Pairing & Credit Card Payoffs)
  # ==========================================
  /transfers/suggested:
    get:
      summary: List suggested transfer pairings requiring user confirmation
      operationId: listSuggestedTransfers
      tags: [Transfers]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of detected potential internal transfer match pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferMatchDetail'

  /transfers/{match_id}/confirm:
    post:
      summary: Confirm a suggested transfer match
      operationId: confirmTransferMatch
      tags: [Transfers]
      security:
        - BearerAuth: []
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer match confirmed and accounting entries linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferMatch'

  /transfers/{match_id}/reject:
    post:
      summary: Reject a suggested transfer match (unlinks transfer_match_id and prevents rematching)
      operationId: rejectTransferMatch
      tags: [Transfers]
      security:
        - BearerAuth: []
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTransferRequest'
      responses:
        '200':
          description: Transfer match rejected and symmetric rejection recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferMatch'

  /transfers/manual-link:
    post:
      summary: Manually link two existing bank transactions as an internal transfer
      operationId: manualLinkTransfer
      tags: [Transfers]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualLinkRequest'
      responses:
        '201':
          description: Manual transfer match created and confirmed between two entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferMatch'

  # ==========================================
  # Statement Imports (CSV / XLSX)
  # ==========================================
  /imports/upload:
    post:
      summary: Upload a bank statement file (CSV, XLSX) for parsing and preview
      operationId: uploadStatement
      tags: [Imports]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, account_id, bank_format]
              properties:
                file:
                  type: string
                  format: binary
                account_id:
                  type: string
                  format: uuid
                bank_format:
                  type: string
                  enum: [tbank_csv, tbank_xlsx, sber_xlsx, alfa_xlsx, generic_csv]
      responses:
        '200':
          description: Statement preview with parsed transactions and duplicate detection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportPreview'

  /imports/{import_id}/confirm:
    post:
      summary: Confirm execution of parsed statement import
      operationId: confirmStatementImport
      tags: [Imports]
      security:
        - BearerAuth: []
      parameters:
        - name: import_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Statement import confirmed and transactions ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResult'

  # ==========================================
  # Analytics & Dashboards
  # ==========================================
  /analytics/summary:
    get:
      summary: Get consolidated cash flows, real expenses, and net savings rate
      operationId: getAnalyticsSummary
      tags: [Analytics]
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: currency
          in: query
          required: false
          schema:
            type: string
            default: 'RUB'
      responses:
        '200':
          description: Financial summary separating cash flow, true expenses, and net assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'

  /analytics/categories:
    get:
      summary: Get hierarchical expense breakdown by category
      operationId: getCategoryAnalytics
      tags: [Analytics]
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Category breakdown of real expenses by payer and beneficiary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryExpenseBreakdown'

  /analytics/balance-history:
    get:
      summary: Point-in-time assets, credit card liabilities, and net worth
      operationId: getBalanceHistory
      tags: [Analytics]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Historical balance series per account and aggregated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceHistoryResponse'

# ==========================================
# Reusable Schemas & Components
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ProblemDetails:
      description: Standard RFC 7807 Error Response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded (RFC 7807)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: "https://familyfinance.local/errors/invalid-argument"
        title:
          type: string
          example: "Validation Error"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "The split sum must equal the bank transaction amount."
        instance:
          type: string
          example: "/api/v1/transactions/entries/123/split"
        invalid_params:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string

    RegisterRequest:
      type: object
      required: [email, password, first_name, family_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        first_name:
          type: string
        last_name:
          type: string
        family_name:
          type: string
          example: "The Ivanovy Family"
        default_currency:
          type: string
          default: "RUB"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user, family]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/User'
        family:
          $ref: '#/components/schemas/Family'

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string

    SessionDTO:
      type: object
      required: [id, user_agent, ip_address, created_at, last_used_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean

    User:
      type: object
      required: [id, email, first_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string

    Family:
      type: object
      required: [id, name, default_currency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        default_currency:
          type: string

    FamilyMember:
      type: object
      required: [id, user_id, role, first_name]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, partner, viewer]
        first_name:
          type: string
        last_name:
          type: string
        color_code:
          type: string

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [partner, viewer]

    UserProfileResponse:
      type: object
      required: [user, family, members]
      properties:
        user:
          $ref: '#/components/schemas/User'
        family:
          $ref: '#/components/schemas/Family'
        members:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'

    BankConnection:
      type: object
      required: [id, name, provider, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [created, authenticating, connected, validation_pending, validating, validation_passed, validation_failed, requires_reauthentication, active, expired, error, disconnected, pending_pairing]
        last_synced_at:
          type: string
          format: date-time
        last_authenticated_at:
          type: string
          format: date-time
        last_validated_at:
          type: string
          format: date-time
        last_validation_status:
          type: string
        last_validation_report_id:
          type: string
          format: uuid
        error_message:
          type: string

    ProviderInfo:
      type: object
      required: [code, name, auth_type, status, supported_instruments]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        auth_type:
          type: string
        status:
          type: string
        supported_instruments:
          type: array
          items:
            type: string
        auth_instructions:
          type: string

    AuthSessionRequest:
      type: object
      properties:
        cookies:
          type: array
          items:
            type: object
            required: [name, value]
            properties:
              name:
                type: string
              value:
                type: string
              domain:
                type: string
              path:
                type: string
        session_data:
          type: string
        credentials:
          type: string

    ValidationReportSummary:
      type: object
      required: [id, overall_result, started_at, finished_at, duration_ms]
      properties:
        id:
          type: string
          format: uuid
        overall_result:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time

    ValidationReport:
      type: object
      required: [id, overall_result, started_at, finished_at, summary]
      properties:
        id:
          type: string
          format: uuid
        family_id:
          type: string
          format: uuid
        bank_connection_id:
          type: string
          format: uuid
        session_version:
          type: integer
        credential_hash:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        overall_result:
          type: string
          enum: [passed, partial_success, failed]
        summary:
          type: object
        authentication:
          type: object
        accounts:
          type: object
        cards:
          type: object
        balances:
          type: object
        transactions:
          type: object
        data_integrity:
          type: object
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'

    ValidationErrorItem:
      type: object
      required: [code, severity, message, stage]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [critical, error, warning, info]
        message:
          type: string
        details:
          type: string
        stage:
          type: string
        retryable:
          type: boolean
        reauthentication_required:
          type: boolean

    CreateConnectionRequest:
      type: object
      required: [name, provider]
      properties:
        name:
          type: string
        provider:
          type: string

    CreateConnectionResponse:
      type: object
      required: [connection, pairing_secret, pairing_secret_expires_at]
      properties:
        connection:
          $ref: '#/components/schemas/BankConnection'
        pairing_secret:
          type: string
          description: "Single-use 32-byte secret shown once for sidecar pairing"
        pairing_secret_expires_at:
          type: string
          format: date-time

    PairConnectionRequest:
      type: object
      required: [pairing_secret]
      properties:
        pairing_secret:
          type: string

    PairConnectionResponse:
      type: object
      required: [connection_id, api_key]
      properties:
        connection_id:
          type: string
          format: uuid
        api_key:
          type: string
          description: "Long-lived connection API key for the sidecar runner"

    SyncJobResponse:
      type: object
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          example: "enqueued"

    Account:
      type: object
      required: [id, name, type, currency]
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [checking, credit_card, savings, deposit, cash]
        currency:
          type: string
        current_balance_minor:
          type: integer
          format: int64
          nullable: true
          description: "Minor currency units (e.g. 10000 = 100.00 RUB). NULL if unknown."
        available_balance_minor:
          type: integer
          format: int64
          nullable: true
        debt_balance_minor:
          type: integer
          format: int64
          nullable: true
        credit_limit_minor:
          type: integer
          format: int64
          nullable: true
        statement_balance_minor:
          type: integer
          format: int64
          nullable: true
        minimal_payment_minor:
          type: integer
          format: int64
          nullable: true
        grace_period_end_date:
          type: string
          format: date
          nullable: true
        balance_updated_at:
          type: string
          format: date-time
          nullable: true
        balance_source:
          type: string
          enum: [bank_api, statement_file, calculated, manual_initial]
          nullable: true
        is_archived:
          type: boolean

    Card:
      type: object
      required: [id, account_id, masked_pan, display_name]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        masked_pan:
          type: string
          example: "*4589"
        display_name:
          type: string
        payment_system:
          type: string
        is_virtual:
          type: boolean
        is_primary:
          type: boolean
        status:
          type: string

    AccountWithCards:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            cards:
              type: array
              items:
                $ref: '#/components/schemas/Card'

    CreateAccountRequest:
      type: object
      required: [name, type, currency]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [checking, savings, deposit, cash]
        currency:
          type: string
          default: "RUB"
        initial_balance_minor:
          type: integer
          format: int64
          nullable: true

    # Two-Layer Ledger Schemas:
    BankTransaction:
      type: object
      required: [id, account_id, amount_minor, currency, account_amount_minor, account_currency, booking_status, operation_type, transaction_time, raw_description]
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        card_id:
          type: string
          format: uuid
          nullable: true
        external_id:
          type: string
          nullable: true
        external_auth_id:
          type: string
          nullable: true
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
        account_amount_minor:
          type: integer
          format: int64
        account_currency:
          type: string
        booking_status:
          type: string
          enum: [pending, posted, cancelled]
        operation_type:
          type: string
          enum: [purchase, refund, transfer_out, transfer_in, atm_cash, fee, card_check]
        related_bank_transaction_id:
          type: string
          format: uuid
          nullable: true
        transaction_time:
          type: string
          format: date-time
        posted_time:
          type: string
          format: date-time
          nullable: true
        merchant_name:
          type: string
          nullable: true
        raw_description:
          type: string
        mcc:
          type: integer
          nullable: true
        bank_category:
          type: string
          nullable: true

    AccountingEntry:
      type: object
      required: [id, account_id, amount_minor, currency, classification, beneficiary_type, entry_time, is_split, is_manual]
      properties:
        id:
          type: string
          format: uuid
        bank_transaction_id:
          type: string
          format: uuid
          nullable: true
        account_id:
          type: string
          format: uuid
        transfer_match_id:
          type: string
          format: uuid
          nullable: true
          description: "Non-destructive reference to transfer_matches. If set, analytical views project this as transfer without erasing category_id."
        amount_minor:
          type: integer
          format: int64
          description: "Signed amount in account currency"
        currency:
          type: string
        classification:
          type: string
          enum: [expense, income, transfer, debt_repayment, excluded]
        category_id:
          type: string
          format: uuid
          nullable: true
        category_name:
          type: string
          nullable: true
        payer_user_id:
          type: string
          format: uuid
          nullable: true
        beneficiary_type:
          type: string
          enum: [household, partner_a, partner_b, child, other]
        entry_time:
          type: string
          format: date-time
        user_comment:
          type: string
          nullable: true
        is_split:
          type: boolean
        is_manual:
          type: boolean

    TransactionView:
      type: object
      required: [view_id, account_id, total_amount_minor, currency, transaction_time, status, is_manual, entries]
      description: Aggregated transaction representation for UI views with stable identity.
      properties:
        view_id:
          type: string
          example: "bt:a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          description: "Stable identity: 'bt:<bank_transaction_id>' for bank-backed transactions, 'manual:<entry_id>' for manual cash operations."
        bank_transaction_id:
          type: string
          format: uuid
          nullable: true
        primary_entry_id:
          type: string
          format: uuid
          description: "ID of the single accounting entry, or the primary entry if split."
        account_id:
          type: string
          format: uuid
        total_amount_minor:
          type: integer
          format: int64
        currency:
          type: string
        transaction_time:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, posted, cancelled]
        is_manual:
          type: boolean
        bank_transaction:
          $ref: '#/components/schemas/BankTransaction'
          nullable: true
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AccountingEntry'
        transfer_match:
          $ref: '#/components/schemas/TransferMatch'
          nullable: true

    PaginatedTransactionViews:
      type: object
      required: [data, next_cursor, total_count]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionView'
        next_cursor:
          type: string
          nullable: true
        total_count:
          type: integer

    CreateManualTxRequest:
      type: object
      required: [account_id, amount_minor, currency, transaction_time, description]
      properties:
        account_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          default: "RUB"
        transaction_time:
          type: string
          format: date-time
        description:
          type: string
        category_id:
          type: string
          format: uuid
        beneficiary_type:
          type: string
          enum: [household, partner_a, partner_b, child, other]

    PatchAccountingEntryRequest:
      type: object
      properties:
        category_id:
          type: string
          format: uuid
        beneficiary_type:
          type: string
          enum: [household, partner_a, partner_b, child, other]
        payer_user_id:
          type: string
          format: uuid
        user_comment:
          type: string
        create_rule_for_merchant:
          type: boolean
          description: "Automatically create persistent categorization rule for this merchant"

    SplitTransactionItem:
      type: object
      required: [category_id, amount_minor, beneficiary_type]
      properties:
        category_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          format: int64
        beneficiary_type:
          type: string
          enum: [household, partner_a, partner_b, child, other]
        user_comment:
          type: string

    SplitTransactionRequest:
      type: object
      required: [splits]
      description: Sum of split amounts must strictly equal the bank transaction amount.
      properties:
        splits:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/SplitTransactionItem'

    Category:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        type:
          type: string
          enum: [expense, income, transfer]
        icon:
          type: string
        color:
          type: string

    CategoryTreeNode:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            subcategories:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    CreateCategoryRequest:
      type: object
      required: [name, type]
      properties:
        parent_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [expense, income, transfer]
        icon:
          type: string
        color:
          type: string

    CategorizationRule:
      type: object
      required: [id, category_id, priority, rule_type, match_value]
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        priority:
          type: integer
        rule_type:
          type: string
          enum: [merchant_name_exact, merchant_name_contains, mcc_code, description_regex, amount_range]
        match_value:
          type: string
        min_amount_minor:
          type: integer
          format: int64
        max_amount_minor:
          type: integer
          format: int64

    CreateRuleRequest:
      type: object
      required: [category_id, rule_type, match_value]
      properties:
        category_id:
          type: string
          format: uuid
        priority:
          type: integer
          default: 100
        rule_type:
          type: string
          enum: [merchant_name_exact, merchant_name_contains, mcc_code, description_regex, amount_range]
        match_value:
          type: string
        apply_retroactively:
          type: boolean
          default: false

    TransferMatch:
      type: object
      required: [id, source_bank_transaction_id, destination_bank_transaction_id, match_type, status]
      properties:
        id:
          type: string
          format: uuid
        source_bank_transaction_id:
          type: string
          format: uuid
        destination_bank_transaction_id:
          type: string
          format: uuid
        match_type:
          type: string
          enum: [exact, probable, manual]
        confidence_score:
          type: number
          format: float
        status:
          type: string
          enum: [auto_confirmed, confirmed, rejected, suggested]
        fee_minor:
          type: integer
          format: int64
        is_credit_card_repayment:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RejectTransferRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Optional explanation for why the proposed transfer match was rejected

    TransferMatchDetail:
      allOf:
        - $ref: '#/components/schemas/TransferMatch'
        - type: object
          properties:
            source_transaction:
              $ref: '#/components/schemas/TransactionView'
            destination_transaction:
              $ref: '#/components/schemas/TransactionView'

    ManualLinkRequest:
      type: object
      required: [source_bank_transaction_id, destination_bank_transaction_id]
      properties:
        source_bank_transaction_id:
          type: string
          format: uuid
        destination_bank_transaction_id:
          type: string
          format: uuid
